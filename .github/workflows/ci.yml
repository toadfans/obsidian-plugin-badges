name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun run lint
      - run: bun test

  release:
    needs: check
    # Only on main (covers push-to-main and manual dispatch on main); never on PRs.
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from package.json
        id: v
        run: |
          VERSION=$(jq -r .version package.json)
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "major=v${VERSION%%.*}" >> "$GITHUB_OUTPUT"
          echo "minor=v$(echo "$VERSION" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"
          echo "Version from package.json: ${VERSION}"

      - name: Skip if this version was already released
        id: gate
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.v.outputs.tag }} already exists — nothing to release."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.v.outputs.tag }} is new — releasing."
          fi

      - name: Create tag and GitHub Release
        if: steps.gate.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "${{ steps.v.outputs.tag }}" \
            --generate-notes \
            --latest

      - name: Move floating major/minor tags
        if: steps.gate.outputs.release == 'true'
        run: |
          git tag -f "${{ steps.v.outputs.major }}" "${{ github.sha }}"
          git tag -f "${{ steps.v.outputs.minor }}" "${{ github.sha }}"
          git push -f origin "${{ steps.v.outputs.major }}" "${{ steps.v.outputs.minor }}"
