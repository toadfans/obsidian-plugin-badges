name: Obsidian Plugin Badges
description: Generate Obsidian plugin badge SVGs and commit them when changed.
branding:
  icon: tag
  color: purple
inputs:
  source-dir:
    description: Directory containing manifest.json.
    required: false
    default: "."
  plugin-slug:
    description: Obsidian Community plugin slug. Defaults to manifest.json id.
    required: false
    default: ""
  commit:
    description: Commit and push changed badge files.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Set up Bun
      if: ${{ github.event.repository.private == false }}
      uses: oven-sh/setup-bun@v2
    - name: Checkout wiki
      if: ${{ github.event.repository.private == false }}
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository }}.wiki
        path: .obsidian-plugin-badges-wiki
    - name: Generate badges
      if: ${{ github.event.repository.private == false }}
      shell: bash
      run: bun run "$GITHUB_ACTION_PATH/src/cli.ts"
      env:
        INPUT_SOURCE_DIR: ${{ inputs.source-dir }}
        INPUT_OUTPUT_DIR: ${{ github.workspace }}/.obsidian-plugin-badges-wiki
        INPUT_PLUGIN_SLUG: ${{ inputs.plugin-slug }}
        INPUT_COMMIT: ${{ inputs.commit }}
